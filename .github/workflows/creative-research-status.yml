name: Creative Research Status Consistency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "projects/creative-system-research/**"
      - "scripts/check_creative_research_status.py"
      - "scripts/tests/test_creative_research_status.py"
      - ".github/workflows/creative-research-status.yml"
  pull_request:
    paths:
      - "README.md"
      - "projects/creative-system-research/**"
      - "scripts/check_creative_research_status.py"
      - "scripts/tests/test_creative_research_status.py"
      - ".github/workflows/creative-research-status.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documented research state
        run: python scripts/check_creative_research_status.py
      - name: Test accounting and drift detection
        run: python -m unittest discover -s scripts/tests -v
