name: Deploy KJ World Synthesis Workbench to Pages
on:
  push:
    branches: [main]
    paths:
      - "world-synthesis-workbench/**"
      - ".github/workflows/world-synthesis-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "world-synthesis-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: world-synthesis-workbench
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
